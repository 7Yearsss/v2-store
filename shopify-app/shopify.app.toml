# Shopify app config for V2Store — managed here, pushed with `npm run deploy`.
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration
#
# The app has no Shopify-hosted code: our own API (apps/server) talks to the
# Admin API with tokens obtained via client credentials (dev) or OAuth (SaaS).

client_id = "c599f9b76cf77bf6b5ab2b28ca0ce2aa"
name = "V2Store"
# Placeholder until the dashboard has a public HTTPS domain; then point this at
# it and set redirect_urls to <domain>/api/shopify/callback.
application_url = "https://shopify.dev/apps/default-app-home"
embedded = false

[build]

[webhooks]
api_version = "2026-07"
# app/uninstalled + 订单 topics → <domain>/api/shopify/webhooks
# 订单订阅在 OAuth 连接成功后由服务端按店注册（webhookSubscriptionCreate），
# 部署有了公网域名后也可以在这里加 [[webhooks.subscriptions]] 静态兜底。

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/api/shopify/webhooks"

[access_scopes]
# Keep in sync with SHOPIFY_SCOPES in apps/server/src/env.ts
scopes = "write_products,read_products,read_inventory,write_inventory,read_locations,read_publications,write_publications,write_files,read_metaobjects,write_metaobjects,read_orders,write_merchant_managed_fulfillment_orders"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
